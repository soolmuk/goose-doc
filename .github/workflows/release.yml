name: Release App

# Publishes goose-doc binaries for every supported platform.
#
# The docs bundle is published separately by docs-bundle.yml, so this workflow
# only deals with the app. Binaries are named with the target triple so the
# platform is unambiguous.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version tag, e.g. 0.1.0 (blank = read from Cargo.toml)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    with:
      upload_artifacts: true

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Checksums
        run: |
          set -euo pipefail
          ls -la dist
          # build-app.yml writes a "<asset>.sha256" next to each asset, so the
          # release-level manifest is just those lines combined.
          cat dist/./*.sha256 > dist/SHA256SUMS
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uploading to existing release $TAG"
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          printf '%s\n' \
            "goose-doc $VERSION" \
            "" \
            "Serves a goose docs root over HTTP so the built-in \`goose-doc-guide\`" \
            "skill reads it without internet access. See README.md." \
            "" \
            "| platform | asset |" \
            "|---|---|" \
            "| Linux x86_64 | \`goose-doc-linux-x86_64\` |" \
            "| macOS arm64 | \`goose-doc-macos-arm64\` |" \
            "| Windows x86_64 | \`goose-doc-windows-x86_64.exe\` |" \
            "" \
            "Docs bundles are published separately under \`docs-v*\` tags." \
            > notes.md

          gh release create "$TAG" dist/* \
            --title "goose-doc $VERSION" \
            --notes-file notes.md
