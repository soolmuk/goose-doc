name: Release

# Publishes one release per goose version, tagged with that version, containing
# both the docs bundle and the goose-doc binaries for every supported platform.
#
# Keeping them together means a consumer needs a single tag: fetch the docs
# bundle from the same release that provides the server binary.
#
# A release already published for a version is left alone, so the six daily runs
# do not rebuild a 344 MB bundle when nothing has changed.

on:
  workflow_dispatch:
    inputs:
      goose_version:
        description: "goose release tag or version (blank = latest goose release)"
        required: false
        type: string
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve goose version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      tag: ${{ steps.pick.outputs.tag }}
      skip: ${{ steps.pick.outputs.skip }}
    steps:
      - name: Pick version
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.goose_version }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            TAG="${INPUT_VERSION}"
          else
            TAG="$(gh api repos/aaif-goose/goose/releases/latest --jq '.tag_name')"
          fi
          case "$TAG" in
            v*) ;;
            *) TAG="v$TAG" ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Resolved goose release: $TAG"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  bundle:
    name: Build docs bundle
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "20"

      - name: Build bundles
        run: |
          set -euo pipefail
          ./tools/build-docs-bundle.sh "${{ needs.resolve.outputs.tag }}" --out-dir ./out
          # The lean bundle is what gets embedded in the binaries and what
          # `fetch` downloads by default: it is ~200 KB versus ~344 MB.
          ./tools/build-lean-bundle.sh "${{ needs.resolve.outputs.version }}" \
            --build-dir /tmp/site --out "./out/goose-docs-${{ needs.resolve.outputs.version }}-lean.tar.gz" 2>/dev/null || {
            # build-lean-bundle.sh builds the site itself when given no build dir
            mkdir -p /tmp/site
            tar xzf "./out/goose-docs-${{ needs.resolve.outputs.version }}.tar.gz" -C /tmp/site
            ./tools/build-lean-bundle.sh "${{ needs.resolve.outputs.version }}" \
              --build-dir /tmp/site \
              --out "./out/goose-docs-${{ needs.resolve.outputs.version }}-lean.tar.gz"
          }
          ls -la ./out

      - name: Upload bundles
        uses: actions/upload-artifact@v7.0.1
        with:
          name: docs-bundle
          path: ./out/goose-docs-${{ needs.resolve.outputs.version }}*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  app:
    name: Build app
    # The app embeds the bundle, so the bundle must be built (and uploaded as an
    # artifact) before the app jobs start.
    needs: [resolve, bundle]
    if: needs.resolve.outputs.skip != 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      upload_artifacts: true
      # Embed the bundle built for this version, so the binaries carry docs
      # that match the release rather than the committed copy.
      docs_bundle_artifact: docs-bundle

  publish:
    name: Publish release
    needs: [resolve, bundle, app]
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: goose-doc-*
          path: dist
          merge-multiple: true

      - name: Download bundle
        uses: actions/download-artifact@v8.0.1
        with:
          name: docs-bundle
          path: dist

      - name: Assemble assets
        id: assets
        run: |
          set -euo pipefail
          ls -la dist

          BUNDLE="goose-docs-${{ needs.resolve.outputs.version }}.tar.gz"
          LEAN="goose-docs-${{ needs.resolve.outputs.version }}-lean.tar.gz"
          test -f "dist/$BUNDLE" || { echo "missing $BUNDLE" >&2; exit 1; }
          test -f "dist/$LEAN" || { echo "missing $LEAN" >&2; exit 1; }

          ENTRIES="$(jq -r '.entries' "dist/$BUNDLE.manifest.json")"
          BYTES="$(jq -r '.bytes' "dist/$BUNDLE.manifest.json")"
          SHA="$(jq -r '.sha256' "dist/$BUNDLE.manifest.json")"
          SIZE_MB="$(awk -v b="$BYTES" 'BEGIN { printf "%.1f", b/1048576 }')"

          # One checksum file covering every published asset, so a consumer can
          # verify whatever it downloads. `fetch` looks the bundle up in this
          # file before extracting it, and the full site bundle is hundreds of
          # megabytes, so an entry that is missing silently disables the check
          # on exactly the downloads that most need it.
          (
            cd dist

            # The .sha256 files are checksums themselves and SHA256SUMS is this
            # file, so neither belongs in the list.
            assets=()
            for f in *; do
              case "$f" in
                SHA256SUMS|*.sha256) continue ;;
              esac
              assets+=("$f")
            done

            sha256sum "${assets[@]}" > SHA256SUMS
            cat SHA256SUMS

            # Every other asset must appear, so a new asset cannot be published
            # unverified by accident.
            for asset in "${assets[@]}"; do
              grep -qE "[ *]$asset\$" SHA256SUMS \
                || { echo "SHA256SUMS is missing $asset" >&2; exit 1; }
            done
            echo "SHA256SUMS covers ${#assets[@]} assets"
          )
          cat dist/SHA256SUMS

          {
            echo "entries=$ENTRIES"
            echo "sha=$SHA"
            echo "size_mb=$SIZE_MB"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ENTRIES: ${{ steps.assets.outputs.entries }}
          SIZE_MB: ${{ steps.assets.outputs.size_mb }}
          SHA: ${{ steps.assets.outputs.sha }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            "goose-doc for goose \`$VERSION\`." \
            "" \
            "One release per goose version: it carries both the docs bundle the" \
            "server serves and the server binary for each platform, so a single" \
            "tag provides everything." \
            "" \
            "| asset | what it is |" \
            "|---|---|" \
            "| \`goose-doc-*\` | the server; the documentation is embedded, so this file alone is enough |" \
            "| \`goose-docs-$VERSION-lean.tar.gz\` | the same docs as a small bundle (~200 KB) |" \
            "| \`goose-docs-$VERSION.tar.gz\` | full docs root with blog images and videos, for browsing the HTML site |" \
            "" \
            "Docs bundle: $ENTRIES pages, $SIZE_MB MB, sha256 \`$SHA\`." \
            "" \
            "## Use it" \
            "" \
            "\`\`\`sh" \
            "# a single binary is enough: the docs are embedded" \
            "goose-doc --port 10650" \
            "" \
            "# to serve the full HTML site instead, fetch the site bundle" \
            "goose-doc fetch $VERSION --variant site" \
            "goose-doc --port 10650" \
            "" \
            "# or point goose at a running server" \
            "GOOSE_DOCS_ROOT=http://<host>:10650" \
            "\`\`\`" \
            "" \
            "The bundle is also usable directly without a server:" \
            "\`GOOSE_DOCS_ROOT=/path/to/extracted/bundle\`." \
            "" \
            "Documentation content is Apache-2.0, from" \
            "https://github.com/aaif-goose/goose (\`$VERSION\`)." \
            > notes.md

          gh release create "$TAG" dist/* \
            --title "goose-doc for goose $VERSION" \
            --notes-file notes.md

      # `fetch` verifies the bundle it downloads against SHA256SUMS before
      # extracting it. A release whose SHA256SUMS omits the bundle silently
      # disables that check, so exercise the real download path against the
      # release that was just published.
      - name: Verify fetch against the published release
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The bundle must be listed in SHA256SUMS, which is what `fetch` reads.
          # Private release assets are served through the API, not a plain URL.
          SUM_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="SHA256SUMS") | .id')"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$SUM_ID" \
            -H "Accept: application/octet-stream" > SHA256SUMS.published
          cat SHA256SUMS.published

          for asset in "goose-docs-$VERSION.tar.gz" "goose-docs-$VERSION-lean.tar.gz"; do
            grep -qE "[ *]$asset\$" SHA256SUMS.published \
              || { echo "SHA256SUMS does not cover $asset, so fetch would skip verification" >&2; exit 1; }
            echo "SHA256SUMS covers $asset"
          done

          # Now the real path: download and verify the default (lean) bundle.
          BIN="dist/goose-doc-linux-x86_64"
          chmod +x "$BIN"
          CACHE="$(mktemp -d)"
          "$BIN" fetch "$VERSION" --cache-dir "$CACHE" 2>&1 | tee fetch.log

          grep -q "cached goose docs" fetch.log \
            || { echo "fetch did not report a cached bundle" >&2; exit 1; }
          if grep -q "no checksum available" fetch.log; then
            echo "fetch skipped checksum verification" >&2
            exit 1
          fi

          "$BIN" doctor --cache-dir "$CACHE" --docs-version "$VERSION" | tee doctor.log
          grep -q "pages:" doctor.log || { echo "fetched bundle is not usable" >&2; exit 1; }

          echo "published release verified"
