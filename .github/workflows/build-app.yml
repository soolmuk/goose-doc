name: Build App

# Builds goose-doc natively on each supported platform and runs the smoke test
# against the real binary on that platform. Cross-compilation is avoided so a
# failure is a genuine platform failure.
#
# Called by release.yml, and runnable on its own.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_artifacts:
        description: "Upload the built binaries as workflow artifacts"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # eframe links against X11/Wayland/xkbcommon on Linux. Without these the
      # build fails at link time, not at compile time.
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Test
        run: cargo test --target ${{ matrix.target }}

      # Runs the actual binary on this platform and checks the HTTP contract the
      # goose-doc-guide skill depends on.
      - name: Smoke test
        shell: bash
        run: ./tools/smoke-test.sh target/${{ matrix.target }}/release/goose-doc

      # A window cannot be opened on a headless runner, so confirm the panel
      # path degrades to headless instead of failing. Linux is the platform
      # where this matters, since servers have no display.
      - name: Panel falls back to headless without a display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          out="$(env -u DISPLAY -u WAYLAND_DISPLAY timeout 20 \
            target/${{ matrix.target }}/release/goose-doc \
            --docs-dir fixtures/docs-root 2>&1 || true)"
          echo "$out"
          echo "$out" | grep -q "Serving goose docs at" \
            || { echo "expected a headless fallback"; exit 1; }
          echo "$out" | grep -qi "panel" \
            || { echo "expected a note about the panel"; exit 1; }

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BIN="target/${{ matrix.target }}/release/goose-doc"

          # shasum is a macOS/Perl tool and is absent from Git Bash on Windows,
          # so fall back to sha256sum and only then report a problem.
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1"
            else
              echo "no sha256 tool available" >&2
              exit 1
            fi
          }

          if [ -f "$BIN.exe" ]; then
            ASSET="goose-doc-${{ matrix.name }}.exe"
            cp "$BIN.exe" "dist/$ASSET"
          else
            ASSET="goose-doc-${{ matrix.name }}"
            cp "$BIN" "dist/$ASSET"
          fi

          (cd dist && checksum "$ASSET" > "$ASSET.sha256")
          ls -la dist

      - name: Upload artifact
        if: ${{ inputs.upload_artifacts != false }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: goose-doc-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
